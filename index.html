<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐播放器</title>
  <style>
    /* 基础样式 */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #ffffff;
      color: #333333;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #uploadForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    #uploadForm input[type="file"] {
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      background-color: #f9f9f9;
      transition: border-color 0.3s, background-color 0.3s;
    }

    #uploadForm button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #uploadForm button:hover {
      background-color: #0056b3;
    }

    #player {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #playerContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    #albumArtContainer {
      width: 300px;
      height: 300px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #albumArt {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #audioAndLyrics {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
    }

    #audioPlayer {
      width: 100%;
      margin-bottom: 20px;
    }

    #lyricsDisplay {
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      padding: 10px;
      line-height: 1.6;
      border: none;
      background-color: transparent;
      overflow-y: auto;
      max-height: 300px;
      border-radius: 5px;
      background-color: rgba(0, 0, 0, 0.05);
    }

    .highlight {
      color: #ff0000;
      font-weight: bold;
    }

    /* 黑暗模式样式 */
    body.dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    body.dark-mode #uploadForm input[type="file"] {
      border-color: #444444;
      background-color: #1e1e1e;
      color: #ffffff;
    }

    body.dark-mode #uploadForm button {
      background-color: #1a73e8;
    }

    body.dark-mode #uploadForm button:hover {
      background-color: #1557b0;
    }

    body.dark-mode #albumArtContainer {
      background-color: #2a2a2a;
    }

    body.dark-mode #lyricsDisplay {
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* 黑暗模式切换按钮 */
    #darkModeToggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #darkModeToggle:hover {
      background-color: #0056b3;
    }

    body.dark-mode #darkModeToggle {
      background-color: #1a73e8;
    }

    body.dark-mode #darkModeToggle:hover {
      background-color: #1557b0;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      #playerContainer {
        flex-direction: column;
        align-items: center;
      }
      
      #albumArtContainer {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- 黑暗模式切换按钮 -->
  <button id="darkModeToggle">切换黑暗模式</button>

  <h1>音乐播放器</h1>
  <form id="uploadForm">
    <input type="file" id="songInput" accept="audio/*" required>
    <input type="file" id="lyricsInput" accept=".lrc">
    <input type="file" id="albumArtInput" accept="image/*">
    <button type="submit">上传</button>
  </form>

  <div id="player">
    <div id="playerContainer">
      <div id="albumArtContainer">
        <img id="albumArt" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' fill='%23f0f0f0'/%3E%3Cpath d='M150 75L100 150H50L150 50l100 100h-50l-50-75zm0 150l50-75h50l-100 100-100-100h50l50 75z' fill='%23ccc'/%3E%3C/svg%3E" alt="默认专辑封面">
      </div>
      <div id="audioAndLyrics">
        <audio id="audioPlayer" controls></audio>
        <div id="lyricsDisplay">请上传音乐文件和歌词</div>
      </div>
    </div>
  </div>

  <script>
    // 黑暗模式切换逻辑
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;

    // 从 localStorage 中读取黑暗模式状态
    const isDarkMode = localStorage.getItem('dark-mode') === 'true';
    if (isDarkMode) {
      body.classList.add('dark-mode');
    }

    // 切换黑暗模式
    darkModeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDarkMode = body.classList.contains('dark-mode');
      localStorage.setItem('dark-mode', isDarkMode); // 保存状态到 localStorage
    });

    // 文件上传和歌词同步逻辑
    document.getElementById('uploadForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const songFile = document.getElementById('songInput').files[0];
      const lyricsFile = document.getElementById('lyricsInput').files[0];
      const albumArtFile = document.getElementById('albumArtInput').files[0];

      if (songFile) {
        // 检查音频文件类型
        const allowedAudioTypes = ['audio/mp3', 'audio/mpeg', 'audio/x-m4a', 'audio/wav', 'audio/ogg'];
        if (!allowedAudioTypes.includes(songFile.type)) {
          alert('仅支持上传 MP3、M4A、WAV、OGG 格式的音频文件！');
          return;
        }

        // 读取歌曲文件
        const songURL = URL.createObjectURL(songFile);
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.src = songURL;

        // 如果有专辑图片文件，读取并显示
        if (albumArtFile) {
          const allowedImageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
          if (!allowedImageTypes.includes(albumArtFile.type)) {
            alert('仅支持上传 JPG、PNG、GIF、WEBP 格式的图片！');
            return;
          }
          
          const albumArtURL = URL.createObjectURL(albumArtFile);
          document.getElementById('albumArt').src = albumArtURL;
        } else {
          // 重置为默认专辑封面
          document.getElementById('albumArt').src = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' fill='%23f0f0f0'/%3E%3Cpath d='M150 75L100 150H50L150 50l100 100h-50l-50-75zm0 150l50-75h50l-100 100-100-100h50l50 75z' fill='%23ccc'/%3E%3C/svg%3E";
        }

        // 如果有歌词文件，读取并解析歌词
        if (lyricsFile) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const lrcText = event.target.result;
            try {
              const lrcData = parseLRC(lrcText);
              setupLyricsSync(audioPlayer, lrcData);
            } catch (error) {
              alert('歌词文件格式不正确，请上传有效的 LRC 文件！');
              console.error(error);
            }
          };
          reader.readAsText(lyricsFile);
        } else {
          document.getElementById('lyricsDisplay').textContent = '无歌词';
        }
      } else {
        alert('请上传歌曲文件！');
      }
    });

    // 解析 LRC 文件
    function parseLRC(lrcText) {
      const lines = lrcText.split('\n');
      const lrcData = [];

      lines.forEach(line => {
        const timeMatches = line.match(/\[(\d+):(\d+\.\d+)\]/g);
        const text = line.replace(/\[(\d+):(\d+\.\d+)\]/g, '').trim();

        if (timeMatches && text) {
          timeMatches.forEach(timeMatch => {
            const minutes = parseFloat(timeMatch.match(/\[(\d+):/)[1]);
            const seconds = parseFloat(timeMatch.match(/:(\d+\.\d+)\]/)[1]);
            const time = minutes * 60 + seconds;
            lrcData.push({ time, text });
          });
        }
      });

      // 如果没有解析到有效的歌词数据，抛出错误
      if (lrcData.length === 0) {
        throw new Error('无效的 LRC 文件格式');
      }

      // 按时间排序
      lrcData.sort((a, b) => a.time - b.time);
      return lrcData;
    }

    // 设置歌词同步
    function setupLyricsSync(audioPlayer, lrcData) {
      const lyricsDisplay = document.getElementById('lyricsDisplay');

      // 渲染歌词
      function renderLyrics(currentTime) {
        let currentLyricIndex = -1;

        // 找到当前时间对应的歌词
        for (let i = 0; i < lrcData.length; i++) {
          if (currentTime >= lrcData[i].time) {
            currentLyricIndex = i;
          } else {
            break;
          }
        }

        // 生成歌词 HTML
        lyricsDisplay.innerHTML = lrcData
          .map((line, index) => {
            if (index === currentLyricIndex) {
              return `<div class="highlight">${line.text}</div>`;
            } else {
              return `<div>${line.text}</div>`;
            }
          })
          .join('');

        // 自动滚动到当前歌词
        const highlightedLyric = lyricsDisplay.querySelector('.highlight');
        if (highlightedLyric) {
          highlightedLyric.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }
      }

      // 监听音频播放时间更新
      audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = audioPlayer.currentTime;
        renderLyrics(currentTime);
      });

      // 初始化歌词显示
      renderLyrics(0);
    }
  </script>
</body>
</html>
